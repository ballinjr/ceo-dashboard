<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>CEO Dashboard</title>
<style>
  :root { --bg: #1a1f2e; --card: #232839; --text: #e8eaf0; --muted: #8b92a5; --accent: #4ec9b0; --bad: #f48771; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
         background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  form { width: 100%; max-width: 340px; background: var(--card); padding: 28px 24px; border-radius: 12px; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  p { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
  input[type=password] { width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid #3a4157; background: var(--bg); color: var(--text); font-size: 15px; }
  input[type=password]:focus { outline: 2px solid var(--accent); border-color: transparent; }
  label { display: flex; gap: 8px; align-items: center; margin: 14px 0 18px; color: var(--muted); font-size: 13px; }
  button { width: 100%; padding: 11px; border: 0; border-radius: 8px; background: var(--accent); color: #10141f; font-weight: 600; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  #err { color: var(--bad); font-size: 13px; min-height: 18px; margin-top: 12px; }
</style>
</head>
<body>
<form id="f" hidden>
  <h1>CEO Dashboard</h1>
  <p>Enter the password to continue.</p>
  <input type="password" id="pw" autocomplete="current-password" placeholder="Password" required autofocus>
  <label><input type="checkbox" id="remember"> Remember on this device</label>
  <button id="go">Unlock</button>
  <div id="err"></div>
</form>

const SLOT = 'ceoDashKey:' + P.s;
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));

async function deriveRaw(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(P.s), iterations: P.i }, base, 256);
}
async function open_(raw) {
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.v) }, key, bytes(P.c)));
  // Replacing the page while this gate is still parsing appends instead of replacing, so wait for load first.
  if (document.readyState !== 'complete') await new Promise(r => addEventListener('load', r, { once: true }));
  document.open(); document.write(html); document.close();
}
function saved() { try { return sessionStorage.getItem(SLOT) || localStorage.getItem(SLOT); } catch (e) { return null; } }
function forget() { try { sessionStorage.removeItem(SLOT); localStorage.removeItem(SLOT); } catch (e) {} }

(async () => {
  const k = saved();
  if (k) { try { await open_(bytes(k)); return; } catch (e) { forget(); } }
  const f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
  f.hidden = false; document.getElementById('pw').focus();
  f.addEventListener('submit', async ev => {
    ev.preventDefault(); err.textContent = ''; go.disabled = true; go.textContent = 'Checking...';
    try {
      const raw = await deriveRaw(document.getElementById('pw').value);
      try {
        sessionStorage.setItem(SLOT, b64(raw));
        if (document.getElementById('remember').checked) localStorage.setItem(SLOT, b64(raw));
      } catch (e) {}
      await open_(raw);
    } catch (e) {
      forget(); err.textContent = 'Wrong password.'; go.disabled = false; go.textContent = 'Unlock';
    }
  });
})();
